name: Automatically build squid documentation
# moved to https://github.com/squid-cache/code-reference.github.io
# and disabled scheduled runs

on:
#  push:
#    branches: [ "main" ]
#  pull_request:
#    branches: [ "main" ]
  workflow_dispatch:
#  schedule:
#    - cron: '5 2 * * *'

permissions:
  contents: write

jobs:
  gen-docs:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Docs
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PUSH_TOKENZ }}

      - name: Checkout Squid sources
        uses: actions/checkout@v7
        with:
          repository: squid-cache/squid
          path: squid

      - name: Check for freshness
        id: fresh
        run: |
          # if we are newer than squid sources, bail
          ourts=$(git log -1 --format="%at")
          squidts=$(cd squid; git log -1 --format="%at")
          if [ "$ourts" -le "$squidts" ] ; then
              echo "doit=false" >>$GITHUB_OUTPUT
          else
              echo "doit=true" >>$GITHUB_OUTPUT
          fi

      - name: Install prerequisite Linux packages
        if: ${{ steps.fresh.output.doit == 'true' }}
        run: |
          # required for "apt-get build-dep" to work
          sudo sed --in-place -E 's/^(Types: deb)$/\1 deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get --quiet=2 update
          sudo apt-get --quiet=2 build-dep squid
          sudo apt-get --quiet=2 install libtool-bin doxygen graphviz pdf2svg

      - name: Prepare squid sources
        if: ${{ steps.fresh.output.doit == 'true' }}
        working-directory: squid
        run: |
          ./bootstrap.sh
          . ./test-suite/buildtests/layer-02-maximus.opts
          eval ./configure $DISTCHECK_CONFIGURE_FLAGS

      - name: Build programming guide
        if: ${{ steps.fresh.output.doit == 'true' }}
        run: |
          doxygen doxyfile

      - name: update self
        if: ${{ steps.fresh.output.doit == 'true' }}
        uses: EndBug/add-and-commit@v9
        with:
          message: "automated update"
          add: "./docs"
          push: true
